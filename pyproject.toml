[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-bridge"
version = "0.1.0"
description = "Small Python CLI/library for controlling Ableton Live through AbletonOSC."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-osc>=1.8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ableton-bridge = "ableton_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
